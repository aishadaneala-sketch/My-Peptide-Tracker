<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Peptide Tracker PWA</title>
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlBlcHRpZGUgVHJhY2tlciIsCiAgInNob3J0X25hbWUiOiAiUGVwdGlkZSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMTIxMjEyIiwKICAidGhlbWVfY29sb3IiOiAiIzEyMTIxMiIKfQ==">
  <style>
    :root {
      --bg-dark: #121212;
      --card-dark: #1e1e1e;
      --text-white: #ffffff;
      --text-muted: #9e9e9e;
      --accent-amber: #e59a4c;
      --accent-amber-hover: #f0a85c;
      --circle-btn: #262626;
      --border-dark: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

    .app-container { max-width: 420px; margin: 0 auto; width: 100%; }

    /* HEADER */
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .icon-circle { width: 42px; height: 42px; background: var(--circle-btn); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border: none; color: white; cursor: pointer; }
    .page-title { font-size: 1.25rem; font-weight: 700; }

    /* VIAL GRAPHIC DISPLAY */
    .vial-stage { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 35px 0; padding: 0 10px; }
    .stat-col { text-align: center; }
    .stat-label { font-size: 0.7rem; font-weight: 800; letter-spacing: 1.2px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 1.5rem; font-weight: 800; }
    .stat-unit { font-size: 0.85rem; font-weight: 600; }

    /* CSS VIAL GRAPHIC */
    .vial-wrapper { position: relative; width: 130px; display: flex; flex-direction: column; align-items: center; }
    .vial-cap { width: 90px; height: 18px; background: #c5c8cf; border-radius: 6px 6px 2px 2px; }
    .vial-neck { width: 70px; height: 12px; background: #8e939d; }
    .vial-body {
      width: 120px; height: 170px; background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 12px 12px 24px 24px;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .vial-label { background: #ffffff; color: #121212; font-weight: 900; font-size: 1.1rem; padding: 12px 20px; border-radius: 4px; z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .vial-liquid { position: absolute; bottom: 0; left: 0; right: 0; height: 35%; background: var(--accent-amber); opacity: 0.85; border-top: 2px solid var(--accent-amber-hover); }

    /* TITLE & NOTES */
    .details-section { text-align: center; margin-bottom: 30px; }
    .peptide-title { font-size: 2.2rem; font-weight: 900; margin-bottom: 12px; }
    .note-text { font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; font-weight: 500; }

    /* METRICS CARD */
    .metrics-card { background: var(--card-dark); border-radius: 20px; padding: 22px 16px; display: flex; justify-content: space-around; text-align: center; border: 1px solid var(--border-dark); margin-bottom: 24px; }
    .metric-box { flex: 1; position: relative; }
    .metric-box:not(:last-child)::after { content: ""; position: absolute; right: 0; top: 15%; height: 70%; width: 1px; background: var(--border-dark); }
    .metric-label { font-size: 0.68rem; font-weight: 800; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .metric-val { font-size: 2.2rem; font-weight: 800; line-height: 1; }
    .metric-sub { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-left: 2px; }

    /* BOTTOM BUTTON */
    .btn-amber { background: var(--accent-amber); color: #121212; border: none; width: 100%; padding: 18px; border-radius: 30px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: background 0.2s; }
    .btn-amber:active { background: var(--accent-amber-hover); }

    /* LOG MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .drawer { background: var(--card-dark); width: 100%; max-width: 420px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; border: 1px solid var(--border-dark); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .input-dark { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-dark); border-radius: 12px; padding: 14px; font-size: 1rem; color: white; margin-bottom: 16px; outline: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- TOP NAVIGATION -->
    <div class="top-nav">
      <button class="icon-circle" onclick="history.back()">❮</button>
      <div class="page-title">Glutathione</div>
      <button class="icon-circle" onclick="alert('Vial Options')">•••</button>
    </div>

    <!-- VIAL DISPLAY -->
    <div class="vial-stage">
      <div class="stat-col">
        <div class="stat-label">VOLUME</div>
        <div class="stat-value">6.0 <span class="stat-unit">mL</span></div>
      </div>

      <div class="vial-wrapper">
        <div class="vial-cap"></div>
        <div class="vial-neck"></div>
        <div class="vial-body">
          <div class="vial-label">GSH</div>
          <div class="vial-liquid" id="liquidFill"></div>
        </div>
      </div>

      <div class="stat-col">
        <div class="stat-label">STRENGTH</div>
        <div class="stat-value">100 <span class="stat-unit">mg/mL</span></div>
      </div>
    </div>

    <!-- DETAILS & STABILITY -->
    <div class="details-section">
      <h1 class="peptide-title">Glutathione</h1>
      <p class="note-text">
        Reconstituted 6 days ago · Lyophilized: -20°C dry/dark.<br>
        Reconstituted: 2-8°C, avoid freeze-thaw, ~2-3 weeks.
      </p>
    </div>

    <!-- METRICS CARD -->
    <div class="metrics-card">
      <div class="metric-box">
        <div class="metric-label">PER DOSE</div>
        <div class="metric-val" id="doseVal">100<span class="metric-sub">u</span></div>
      </div>
      <div class="metric-box">
        <div class="metric-label">MG LEFT</div>
        <div class="metric-val" id="mgLeft">300<span class="metric-sub">mg</span></div>
      </div>
      <div class="metric-box">
        <div class="metric-label">UNITS LEFT</div>
        <div class="metric-val" id="unitsLeft">300<span class="metric-sub">u</span></div>
      </div>
    </div>

    <!-- LOG DOSE BUTTON -->
    <button class="btn-amber" onclick="openLogModal()">Log dose</button>
  </div>

  <!-- LOG DOSE MODAL -->
  <div class="modal-overlay" id="logModal">
    <div class="drawer">
      <div class="drawer-header">
        <button class="icon-circle" onclick="closeLogModal()">✕</button>
        <h2 style="font-size: 1.2rem;">Log Injection Dose</h2>
        <div></div>
      </div>
      
      <label class="stat-label" style="display:block; margin-bottom:8px;">UNITS INJECTED</label>
      <input type="number" class="input-dark" id="logUnits" value="100">

      <label class="stat-label" style="display:block; margin-bottom:8px;">INJECTION SITE</label>
      <input type="text" class="input-dark" id="logSite" placeholder="e.g. Subcutaneous Abdomen">

      <button class="btn-amber" onclick="confirmDose()">Confirm & Deduct Dose</button>
    </div>
  </div>

  <script>
    let currentUnits = 300;
    let currentMg = 300;

    function openLogModal() {
      document.getElementById('logModal').classList.add('active');
    }

    function closeLogModal() {
      document.getElementById('logModal').classList.remove('active');
    }

    function confirmDose() {
      const unitsUsed = parseInt(document.getElementById('logUnits').value) || 0;
      if (unitsUsed > 0 && currentUnits >= unitsUsed) {
        currentUnits -= unitsUsed;
        currentMg = Math.round((currentUnits / 300) * 300);

        document.getElementById('unitsLeft').innerHTML = `${currentUnits}<span class="metric-sub">u</span>`;
        document.getElementById('mgLeft').innerHTML = `${currentMg}<span class="metric-sub">mg</span>`;

        // Adjust liquid level inside graphic
        const fillPercent = Math.max(5, (currentUnits / 300) * 35);
        document.getElementById('liquidFill').style.height = `${fillPercent}%`;

        closeLogModal();
        alert(`Logged ${unitsUsed}u injection! Remaining: ${currentUnits}u`);
      }
    }
  </script>
</body>
</html>
